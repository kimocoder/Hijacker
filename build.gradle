// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.0-beta03'
// Navigation Safe Args plugin for generating type-safe argument classes
        classpath 'androidx.navigation:navigation-safe-args-gradle-plugin:2.9.6'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Force a single Kotlin stdlib variant to avoid duplicate classes from mixed versions
    configurations.configureEach {
        resolutionStrategy.force(
                'org.jetbrains.kotlin:kotlin-stdlib:1.8.0',
                'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0',
                'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0'
        )
    }
}

tasks.register('clean', Delete) {
    // `buildDir` (File) is deprecated in favor of the lazy `layout.buildDirectory` API.
    // Delete accepts a Provider/DirectoryProperty, so we can pass the layout directly.
    delete rootProject.layout.buildDirectory
}