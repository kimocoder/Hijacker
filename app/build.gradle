apply plugin: 'com.android.application'

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
    options.deprecation = true
}

android {
    //noinspection GradleDependency
    compileSdk = 34
    // Use Java 11 for compilation to match modern JDKs and suppress obsolete source/target warnings
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    // Java toolchain configuration (keeps builds reproducible if you want Gradle to select a JDK)
    // Note: AGP will still rely on compileOptions for Android Java compilation. Toolchain ensures other Java tasks use the correct JVM.
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(11)
        }
    }

    // If Kotlin plugin is applied, set JVM target to 11 for Kotlin compilation
    // This is a safe no-op if Kotlin is not used in the project
    project.plugins.withId('org.jetbrains.kotlin.android') {
        kotlin {
            jvmTarget = "11"
        }
    }

    defaultConfig {
        applicationId = "com.hijacker"
        minSdk = 21
        //noinspection OldTargetApi
        targetSdk = 34
        versionCode = 40
        android.buildFeatures.buildConfig = true
        versionName = 'v2.0'
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags = []
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path = "CMakeLists.txt"
        }
    }
    ndkVersion = '29.0.14206865'
    namespace = 'com.hijacker'
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.annotation:annotation:1.9.1'
    // Preference support (AndroidX)
    implementation 'androidx.preference:preference:1.2.1'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.7.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

repositories {
    /libs/
    google()
    mavenCentral()
}