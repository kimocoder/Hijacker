## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#Mon Nov 24 10:25:43 CET 2025
android.enableJetifier=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048M -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64
# Intentionally keep dependency constraints usage if project requires it
android.dependency.useConstraints=true
# R8 / resource shrinking flags (keep if intentional)
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
# Suppress sync-time warning when library constraints are enabled
# This improves project import performance and silences the sync issue message
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

### Enable Gradle Configuration Cache to improve subsequent build times
# See: https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true

# NOTE: The following legacy/compat flags were present previously but are deprecated
# and will be removed in AGP 10.0. They are commented out here to adopt AGP defaults.
